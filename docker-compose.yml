services:
  nosql-rocksdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nosql-rocksdb-engine
    restart: "no"
    tty: true
    stdin_open: true
    ports:
      - "8505:8505"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Ho_Chi_Minh
